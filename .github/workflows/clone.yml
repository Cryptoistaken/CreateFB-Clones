name: Build clones

# Takes original.apk and produces 10 side-by-side installable clones:
#   package com.dgd.createfb   -> com.dgd.createfbc1 ... com.dgd.createfbc10
#   label   DGDcreateFB        -> DGDcreateFB 1 ... DGDcreateFB 10
# All clones share one signature so they install next to each other
# (and next to the original) with no external cloner app.

on:
  push:
    branches: ["master"]
    paths: ["original.apk", ".github/workflows/clone.yml"]
  workflow_dispatch:

jobs:
  clones:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install apktool
        run: |
          # Runners already ship Android build-tools - use the newest present.
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)
          echo "BT=$BT" >> "$GITHUB_ENV"
          ls "$BT" | grep -E "^(apksigner|zipalign|aapt)$"
          sudo curl -fSL https://raw.githubusercontent.com/iBotPeaches/Apktool/main/scripts/linux/apktool -o /usr/local/bin/apktool
          sudo curl -fSL https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.11.1.jar -o /usr/local/bin/apktool.jar
          sudo chmod +x /usr/local/bin/apktool
          apktool --version

      - name: Restore signing keystore
        env:
          CLONE_KEYSTORE_B64: ${{ secrets.CLONE_KEYSTORE_B64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/ks"
          if [ -n "$CLONE_KEYSTORE_B64" ]; then
            echo "$CLONE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ks/clone.jks"
            echo "Using persistent signing key (updates install over previous clones)"
          else
            echo "No CLONE_KEYSTORE_B64 secret - generating throwaway key (clones will need reinstall on next build)"
            keytool -genkeypair -keystore "$RUNNER_TEMP/ks/clone.jks" -alias clone \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass android -keypass android -dname "CN=Clone"
          fi

      - name: Write password pre-fill script
        run: |
          cat > "$RUNNER_TEMP/patch_pw.py" <<'PYEOF'
          # Pre-fills the password default inside the getSavedRegPassword /
          # getSavedPassword getters so every fresh clone starts with the
          # configured password already set.
          import os, re, sys, pathlib
          work = pathlib.Path(sys.argv[1])
          pwd = os.environ.get("CLONE_REG_PASSWORD", "")
          assert pwd, "CLONE_REG_PASSWORD is empty"
          assert re.fullmatch(r"[A-Za-z0-9_.-]+", pwd), "password has smali-unsafe chars"
          meth_re = re.compile(r"\.method\s+\S*\s*(\S*(?:getSavedRegPassword|getSavedPassword|RegPassword)\([^)]*\))\s*$")
          empty_re = re.compile(r'(\s*const-string\s+(\S+),\s*)""(\s*)$')
          changed = []
          seen_methods = []
          for sm in sorted(work.rglob("*.smali")):
              lines = sm.read_text().splitlines(keepends=True)
              i = 0
              while i < len(lines):
                  m = meth_re.match(lines[i])
                  if not m:
                      i += 1
                      continue
                  j = i + 1
                  while j < len(lines) and ".end method" not in lines[j]:
                      j += 1
                  body = lines[i:j + 1]
                  seen_methods.append(f"{sm}:{i + 1} {m.group(1)}")
                  print(f"--- getter {sm}:{i + 1} {m.group(1)} ---")
                  print("".join(body))
                  has_get = any("SharedPreferences;->getString(" in ln for ln in body)
                  empties = [k for k, ln in enumerate(body) if empty_re.match(ln)]
                  if has_get and len(empties) == 1:
                      k = empties[0]
                      e = empty_re.match(body[k])
                      body[k] = f'{e.group(1)}"{pwd}"{e.group(3)}'
                      lines[i:j + 1] = body
                      sm.write_text("".join(lines))
                      lines = sm.read_text().splitlines(keepends=True)
                      changed.append(f"{sm}:{i + 1 + k}")
                  i = j + 1
          print("Patched defaults:")
          for c in changed:
              print("  " + c)
          if not seen_methods:
              print("ERROR: no password getter method found")
              sys.exit(1)
          if not changed:
              print("ERROR: getters found but no single empty default to patch (see dumps above)")
              sys.exit(1)
          PYEOF
          echo "patch script ready"

      - name: Build 10 clones
        env:
          CLONE_REG_PASSWORD: ${{ secrets.CLONE_REG_PASSWORD }}
          CLONE_KEYSTORE_PASSWORD: ${{ secrets.CLONE_KEYSTORE_PASSWORD }}
          CLONE_KEY_ALIAS: ${{ secrets.CLONE_KEY_ALIAS }}
          CLONE_KEY_PASSWORD: ${{ secrets.CLONE_KEY_PASSWORD }}
        run: |
          set -e
          BT="${BT%/}"
          KS="$RUNNER_TEMP/ks/clone.jks"
          : "${CLONE_KEYSTORE_PASSWORD:=android}"
          : "${CLONE_KEY_ALIAS:=clone}"
          : "${CLONE_KEY_PASSWORD:=$CLONE_KEYSTORE_PASSWORD}"
          mkdir -p clones
          for i in $(seq 1 10); do
            echo "=== Clone $i: com.dgd.createfbc${i} / DGDcreateFB ${i} ==="
            rm -rf work
            apktool d -f -o work original.apk > /dev/null
            sed -i "s/package=\"com\.dgd\.createfb\"/package=\"com.dgd.createfbc${i}\"/" work/AndroidManifest.xml
            sed -i "s/DGDcreateFB/DGDcreateFB ${i}/g" work/AndroidManifest.xml
            if [ -n "$CLONE_REG_PASSWORD" ]; then
              python3 "$RUNNER_TEMP/patch_pw.py" work
            else
              echo "No CLONE_REG_PASSWORD secret - clones start with empty password"
            fi
            grep -q "com.dgd.createfbc${i}" work/AndroidManifest.xml
            apktool b work -o "clones/unsigned-${i}.apk" > /dev/null
            "$BT/zipalign" -f 4 "clones/unsigned-${i}.apk" "clones/aligned-${i}.apk"
            "$BT/apksigner" sign --ks "$KS" \
              --ks-pass "pass:$CLONE_KEYSTORE_PASSWORD" \
              --ks-key-alias "$CLONE_KEY_ALIAS" \
              --key-pass "pass:$CLONE_KEY_PASSWORD" \
              --out "clones/CreateFB-${i}.apk" "clones/aligned-${i}.apk"
            rm -f "clones/unsigned-${i}.apk" "clones/aligned-${i}.apk"
          done
          echo "--- verify ---"
          for f in clones/CreateFB-*.apk; do "$BT/apksigner" verify "$f"; done
          "$BT/aapt" dump badging clones/CreateFB-1.apk | head -n 2
          "$BT/aapt" dump badging clones/CreateFB-10.apk | head -n 2
          ls -lh clones/

      - name: Upload clones
        uses: actions/upload-artifact@v4
        with:
          name: clones
          path: clones/CreateFB-*.apk

      - name: Publish GitHub Release
        if: github.ref_type == 'branch' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: clones-v${{ github.run_number }}
          name: clones-v${{ github.run_number }}
          body: "10 side-by-side clones of DGDcreateFB (1-10). Install any/all next to each other."
          files: clones/CreateFB-*.apk
