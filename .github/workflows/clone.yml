name: Build clones

# Takes original.apk and produces 10 side-by-side installable clones:
#   package com.dgd.createfb   -> com.dgd.createfbc1 ... com.dgd.createfbc10
#   label   DGDcreateFB        -> DGDcreateFB 1 ... DGDcreateFB 10
#   icon    royal-blue seal badge with the clone number (design B, circle-safe)
# All clones share one signature so they install next to each other
# (and next to the original) with no external cloner app.

on:
  push:
    branches: ["master"]
    paths: ["original.apk", "badge_icons.py", "patch_gates.py", ".github/workflows/clone.yml"]
  workflow_dispatch:

jobs:
  clones:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install apktool
        run: |
          # Runners already ship Android build-tools - use the newest present.
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)
          echo "BT=$BT" >> "$GITHUB_ENV"
          ls "$BT" | grep -E "^(apksigner|zipalign|aapt)$"
          sudo curl -fSL https://raw.githubusercontent.com/iBotPeaches/Apktool/main/scripts/linux/apktool -o /usr/local/bin/apktool
          sudo curl -fSL https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.11.1.jar -o /usr/local/bin/apktool.jar
          sudo chmod +x /usr/local/bin/apktool
          apktool --version

      - name: Restore signing keystore
        env:
          CLONE_KEYSTORE_B64: ${{ secrets.CLONE_KEYSTORE_B64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/ks"
          if [ -n "$CLONE_KEYSTORE_B64" ]; then
            echo "$CLONE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ks/clone.jks"
            echo "Using persistent signing key (updates install over previous clones)"
          else
            echo "No CLONE_KEYSTORE_B64 secret - generating throwaway key (clones will need reinstall on next build)"
            keytool -genkeypair -keystore "$RUNNER_TEMP/ks/clone.jks" -alias clone \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass android -keypass android -dname "CN=Clone"
          fi

      - name: Write password pre-fill script
        run: |
          cat > "$RUNNER_TEMP/patch_pw.py" <<'PYEOF'
          # Pre-fills the password default at every SharedPreferences.getString
          # call that reads the "reg_password" key (directly, or via the
          # KEY_REG_PASSWORD static field / its synthetic accessors).
          import os, re, sys, pathlib
          work = pathlib.Path(sys.argv[1])
          pwd = os.environ.get("CLONE_REG_PASSWORD", "")
          assert pwd, "CLONE_REG_PASSWORD is empty"
          assert re.fullmatch(r"[A-Za-z0-9_.-]+", pwd), "password has smali-unsafe chars"
          meth_start = re.compile(r"\.method\s+(?:\S+\s+)?(\S+\([^)]*\)\S*)\s*$")
          accessor_of_key = set()
          files = sorted(work.rglob("*.smali"))
          # Pass 1: synthetic accessors that return KEY_REG_PASSWORD.
          for sm in files:
              lines = sm.read_text().splitlines()
              i = 0
              while i < len(lines):
                  m = meth_start.match(lines[i])
                  if m and "access$" in m.group(1) and m.group(1).endswith(")Ljava/lang/String;"):
                      j = i + 1
                      while j < len(lines) and ".end method" not in lines[j]:
                          if ";->KEY_REG_PASSWORD:" in lines[j] and "sget-object" in lines[j]:
                              accessor_of_key.add(m.group(1))
                              break
                          j += 1
                      i = j
                  i += 1
          print("Key accessors:", sorted(accessor_of_key) or "NONE")
          def is_key_source(ln):
              if ";->KEY_REG_PASSWORD:" in ln and "sget-object" in ln:
                  return True
              if re.match(r'\s*const-string\s+\S+,\s*"reg_password"\s*$', ln):
                  return True
              for acc in accessor_of_key:
                  if acc in ln and "invoke-static" in ln:
                      return True
              return False
          empty_re = re.compile(r'(\s*const-string\s+\S+,\s*)""(\s*)$')
          changed, key_hits, getstr_n = [], [], 0
          for sm in files:
              raw = sm.read_text().splitlines(keepends=True)
              dirty = False
              for i, ln in enumerate(raw):
                  if "SharedPreferences;->getString(" in ln:
                      getstr_n += 1
                  if not is_key_source(ln):
                      continue
                  key_hits.append(f"{sm}:{i + 1}: {ln.strip()}")
                  # Patch only if an empty default feeds a getString call below
                  # (never touch putString/clear paths).
                  empty_at, getstr_at = None, None
                  for j in range(i + 1, min(i + 13, len(raw))):
                      if empty_at is None and empty_re.match(raw[j]):
                          empty_at = j
                      if "SharedPreferences;->getString(" in raw[j]:
                          getstr_at = j
                          break
                      if ".end method" in raw[j]:
                          break
                  if empty_at is not None and getstr_at is not None and empty_at < getstr_at:
                      m1 = empty_re.match(raw[empty_at])
                      raw[empty_at] = f'{m1.group(1)}"{pwd}"{m1.group(2)}'
                      changed.append(f"{sm}:{empty_at + 1} (getString @{getstr_at + 1})")
                      print(f"--- patched context {sm}:{empty_at + 1} ---")
                      print("".join(raw[max(0, empty_at - 6):getstr_at + 2]))
                      dirty = True
              if dirty:
                  sm.write_text("".join(raw))
          print(f"Key sources hit: {len(key_hits)}")
          for h in key_hits[:20]:
              print("  " + h)
          print(f"SharedPreferences.getString sites: {getstr_n}")
          print("Patched defaults:")
          for c in changed:
              print("  " + c)
          if not changed:
              print("ERROR: no default patched - dumping getString contexts:")
              for sm in files:
                  lines = sm.read_text().splitlines()
                  for i, ln in enumerate(lines):
                      if "SharedPreferences;->getString(" in ln:
                          print(f"--- {sm}:{i + 1} ---")
                          print("\n".join(lines[max(0, i - 12):i + 3]))
              sys.exit(1)
          PYEOF
          echo "patch script ready"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Badge unit tests
        run: |
          pip install pillow
          python3 -m py_compile badge_icons.py test_badge_icons.py
          python3 -m unittest discover -s . -p "test_*.py" -v

      - name: Build 10 clones
        env:
          CLONE_REG_PASSWORD: ${{ secrets.CLONE_REG_PASSWORD }}
          CLONE_KEYSTORE_PASSWORD: ${{ secrets.CLONE_KEYSTORE_PASSWORD }}
          CLONE_KEY_ALIAS: ${{ secrets.CLONE_KEY_ALIAS }}
          CLONE_KEY_PASSWORD: ${{ secrets.CLONE_KEY_PASSWORD }}
        run: |
          set -e
          BT="${BT%/}"
          KS="$RUNNER_TEMP/ks/clone.jks"
          : "${CLONE_KEYSTORE_PASSWORD:=android}"
          : "${CLONE_KEY_ALIAS:=clone}"
          : "${CLONE_KEY_PASSWORD:=$CLONE_KEYSTORE_PASSWORD}"
          mkdir -p clones
          for i in $(seq 1 10); do
            echo "=== Clone $i: com.dgd.createfbc${i} / DGDcreateFB ${i} ==="
            rm -rf work
            apktool d -f -o work original.apk > /dev/null
            # Pin components to their real (unrenamed) classes: smali keeps
            # package com.dgd.createfb, so relative names would resolve to
            # the non-existent com.dgd.createfbcN.* after the rename below.
            sed -i 's/android:name="\.LauncherActivity"/android:name="com.dgd.createfb.LauncherActivity"/' work/AndroidManifest.xml
            sed -i 's/android:name="\.MainActivity"/android:name="com.dgd.createfb.MainActivity"/' work/AndroidManifest.xml
            sed -i 's/android:name="\.OtpMonitorService"/android:name="com.dgd.createfb.OtpMonitorService"/' work/AndroidManifest.xml
            grep -q 'android:name="com.dgd.createfb.LauncherActivity"' work/AndroidManifest.xml
            grep -q 'android:name="com.dgd.createfb.MainActivity"' work/AndroidManifest.xml
            sed -i "s/package=\"com\.dgd\.createfb\"/package=\"com.dgd.createfbc${i}\"/" work/AndroidManifest.xml
            sed -i "s/DGDcreateFB/DGDcreateFB ${i}/g" work/AndroidManifest.xml
            if [ -n "$CLONE_REG_PASSWORD" ]; then
              python3 "$RUNNER_TEMP/patch_pw.py" work
            else
              echo "No CLONE_REG_PASSWORD secret - clones start with empty password"
            fi
            # Neutralize tamper gates (package/label/cert/dex checks in
            # MainActivity that crash any repackaged clone). See patch_gates.py.
            python3 patch_gates.py work
            grep -q "com.dgd.createfbc${i}" work/AndroidManifest.xml
            python3 badge_icons.py --dir work --number "$i"
            apktool b work -o "clones/unsigned-${i}.apk" > /dev/null
            "$BT/zipalign" -f 4 "clones/unsigned-${i}.apk" "clones/aligned-${i}.apk"
            "$BT/apksigner" sign --ks "$KS" \
              --ks-pass "pass:$CLONE_KEYSTORE_PASSWORD" \
              --ks-key-alias "$CLONE_KEY_ALIAS" \
              --key-pass "pass:$CLONE_KEY_PASSWORD" \
              --out "clones/CreateFB-${i}.apk" "clones/aligned-${i}.apk"
            rm -f "clones/unsigned-${i}.apk" "clones/aligned-${i}.apk"
          done
          echo "--- verify ---"
          for f in clones/CreateFB-*.apk; do "$BT/apksigner" verify "$f"; done
          "$BT/aapt" dump badging clones/CreateFB-1.apk | head -n 2
          "$BT/aapt" dump badging clones/CreateFB-10.apk | head -n 2
          ls -lh clones/

      - name: Render badge preview
        run: |
          rm -rf pvwork
          apktool d -f -o pvwork original.apk > /dev/null
          ICON=$(find pvwork/res -name ic_launcher.png | sort | tail -n 1)
          echo "Base icon: $ICON"
          python3 badge_icons.py --preview "$ICON" preview.png
          ls -lh preview.png

      - name: Upload clones
        uses: actions/upload-artifact@v4
        with:
          name: clones
          path: clones/CreateFB-*.apk

      - name: Upload badge preview
        uses: actions/upload-artifact@v4
        with:
          name: badge-preview
          path: preview.png

      - name: Publish GitHub Release
        if: github.ref_type == 'branch' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: clones-v${{ github.run_number }}
          name: clones-v${{ github.run_number }}
          body: "10 side-by-side clones of DGDcreateFB (1-10). Install any/all next to each other."
          files: clones/CreateFB-*.apk
